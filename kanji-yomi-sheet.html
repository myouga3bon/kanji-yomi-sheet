<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>漢字読みシートクリエーター</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
    margin: 0;
    background: #fbeef1;
    color: #3a2830;
  }
  #selectView { max-width: 900px; margin: 0 auto; padding: 24px 20px 80px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; color: #7a3b4e; }
  .subtitle { color: #8a6470; font-size: 0.9rem; margin: 0 0 20px; }

  .toolbar {
    position: sticky; top: 0; z-index: 10;
    background: #fbeef1ee; backdrop-filter: blur(4px);
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 0; margin-bottom: 10px; border-bottom: 1px solid #e8c3cd;
  }
  button {
    font-size: 0.95rem; padding: 8px 16px; border-radius: 6px;
    border: 1px solid #d79bab; background: #fff; color: #7a3b4e; cursor: pointer;
  }
  button:hover { background: #fbe4e9; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  #generateBtn {
    margin-left: auto; background: #b5657d; color: #fff; border-color: #b5657d;
    font-weight: bold; padding: 10px 22px;
  }
  #generateBtn:hover { background: #954f65; }
  #generateBtn:disabled { background: #cda3ad; border-color: #cda3ad; color: #fff; }

  #clearBtn { color: #a15a6d; border-color: #d79bab; }

  #countLabel { color: #7a5560; font-size: 0.9rem; }

  .grade-switch {
    display: flex; gap: 0; margin-bottom: 14px;
    border: 1px solid #d79bab; border-radius: 8px; overflow: hidden; width: fit-content;
  }
  .grade-btn {
    border: none; border-radius: 0; background: #fff; color: #954f65;
    padding: 8px 20px; font-size: 0.92rem; font-weight: bold;
  }
  .grade-btn + .grade-btn { border-left: 1px solid #d79bab; }
  .grade-btn:hover { background: #fbe4e9; }
  .grade-btn.active { background: #b5657d; color: #fff; }
  .grade-btn.active:hover { background: #b5657d; }

  .test-panel {
    background: #fff5f7; border: 1px solid #e8c3cd; border-radius: 8px;
    padding: 12px 14px; margin-bottom: 20px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .test-panel .label { font-weight: bold; color: #7a3b4e; font-size: 0.92rem; margin-right: 4px; }
  .test-panel .desc { color: #8a6470; font-size: 0.82rem; width: 100%; margin: -4px 0 2px; }
  .plainTestBtn, .mixedTestBtn {
    background: #fff; border: 1px solid #d79bab; color: #954f65;
  }
  .plainTestBtn:hover, .mixedTestBtn:hover { background: #fbe4e9; }
  .plainTestBtn:disabled, .mixedTestBtn:disabled { opacity: 0.5; }

  .unit-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 10px;
  }
  .unit-card {
    display: flex; align-items: flex-start; gap: 10px;
    background: #fff; border: 1px solid #f0d5dc; border-radius: 8px;
    padding: 12px 14px; cursor: pointer; user-select: none;
  }
  .unit-card:hover { border-color: #d79bab; }
  .unit-card.checked { border-color: #b5657d; background: #fdeef1; }
  .unit-card input { margin-top: 3px; width: 16px; height: 16px; flex-shrink: 0; accent-color: #b5657d; }
  .unit-num { font-weight: bold; color: #b5657d; margin-right: 4px; }
  .unit-title { font-size: 0.95rem; line-height: 1.4; }
  .unit-count { display: block; color: #a48890; font-size: 0.78rem; margin-top: 2px; }

  #printView { display: none; }
  #printView.active { display: block; }
  #selectView.hidden { display: none; }
  .print-toolbar {
    position: sticky; top: 0; z-index: 10;
    background: #fff; border-bottom: 1px solid #ddd;
    padding: 10px 16px; display: flex; gap: 10px; align-items: center;
  }
  .print-toolbar .spacer { flex: 1; }

  #printPaper {
    display: flex; flex-direction: column; align-items: center; gap: 10mm;
    margin: 16px auto 60px; background: transparent;
  }

  /* one .page = one physical A4 sheet */
  .page {
    width: 210mm; min-height: 297mm; background: #fff;
    box-shadow: 0 0 8px rgba(0,0,0,0.15); padding: 12mm;
    position: relative;
  }
  .page.fixed { height: 297mm; overflow: hidden; }
  .page-label {
    color: #a15a6d; font-size: 0.78rem; font-weight: bold; margin-bottom: -4mm;
    align-self: flex-start; margin-left: calc(50% - 105mm);
  }

  .doc-header { text-align: center; margin-bottom: 6mm; }
  .doc-header h2 { margin: 0 0 2mm; font-size: 1.15rem; }
  .doc-header .meta { display: flex; justify-content: flex-end; gap: 14px; font-size: 0.85rem; color: #333; border-top: 1px solid #999; border-bottom: 1px solid #999; padding: 3mm 0; }
  .doc-header .meta.test-meta { justify-content: space-between; }

  .columns { column-count: 2; column-gap: 10mm; column-rule: 0.4pt solid #bbb; }
  section.title-block { margin-bottom: 4mm; }
  /* Reading print uses an explicit N-column grid layout (JS pre-splits items
     into .col elements, one per grid column) instead of CSS column-count,
     because Chromium's column-balance algorithm has a rendering bug (text
     clipping/overlap) that reliably reproduces once print content approaches
     a full page's height. Independent block-flow columns avoid it entirely;
     CSS Grid with 1fr tracks guarantees every column is exactly equal width. */
  .print-flexcols { display: grid; grid-template-columns: repeat(3, 1fr); column-gap: 7mm; align-items: start; }
  .print-flexcols .col { min-width: 0; }
  .print-flexcols .col:not(:first-child) { border-left: 0.4pt solid #bbb; }
  .col-num {
    display: inline-flex; align-items: center; justify-content: center;
    width: 5.5mm; height: 5.5mm; border: 0.9pt solid #333;
    font-size: 9pt; font-weight: bold; color: #333; margin-bottom: 2mm;
  }
  h2.section-title {
    font-size: 10.5pt; background: #333; color: #fff; padding: 1.2mm 2.5mm;
    margin: 0 0 1.8mm; break-after: avoid; break-inside: avoid;
    -webkit-column-break-after: avoid; -webkit-column-break-inside: avoid;
  }
  .kanji-block { break-inside: avoid; -webkit-column-break-inside: avoid; margin-bottom: 2.2mm; }
  .kanji-head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 4mm; border-bottom: 0.8pt solid #333; padding-bottom: 0.3mm;
  }
  .kanji-head .kj { font-size: 12.5pt; font-weight: bold; }
  .kanji-head .kj-reading { font-size: 8.3pt; color: #555; white-space: nowrap; flex-shrink: 0; }
  .wordrow {
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 4mm; padding: 0.4mm 0; font-size: 9pt;
  }
  .wordrow .word { }
  .wordrow .reading { white-space: nowrap; color: #444; flex-shrink: 0; font-size: 8pt; }

  /* check-test styles: all sized via --k (shrink-to-fit multiplier, set by JS) */
  .test-columns, .answer-columns { column-gap: calc(8mm * var(--k, 1)); }
  .test-row {
    display: flex; align-items: baseline; gap: calc(2.5mm * var(--k, 1));
    padding: calc(1mm * var(--k, 1)) 0;
    font-size: calc(9.5pt * var(--k, 1)); break-inside: avoid;
  }
  .test-row .num { color: #888; width: calc(5mm * var(--k, 1)); flex-shrink: 0; text-align: right; font-size: calc(8pt * var(--k, 1)); }
  .test-row .word { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .test-row .blank { width: calc(22mm * var(--k, 1)); border-bottom: 0.6pt solid #777; flex-shrink: 0; }
  .test-section-title {
    font-size: calc(9.5pt * var(--k, 1)); background: #666; color: #fff;
    padding: calc(1mm * var(--k, 1)) calc(2.5mm * var(--k, 1));
    margin: calc(3mm * var(--k, 1)) 0 calc(1.5mm * var(--k, 1)) 0;
    break-after: avoid; break-inside: avoid;
  }
  .test-section-title:first-child { margin-top: 0; }

  .answer-block h3 {
    font-size: 11pt; border-bottom: 1pt solid #333; padding-bottom: 1mm; margin: 0 0 3mm;
    text-align: center;
  }
  .answer-row {
    display: flex; align-items: baseline; gap: calc(2.5mm * var(--k, 1));
    padding: calc(0.6mm * var(--k, 1)) 0; font-size: calc(8.5pt * var(--k, 1));
    break-inside: avoid;
  }
  .answer-row .num { color: #888; width: calc(5mm * var(--k, 1)); flex-shrink: 0; text-align: right; font-size: calc(7.5pt * var(--k, 1)); }
  .answer-row .word { width: calc(26mm * var(--k, 1)); flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .answer-row .reading { color: #444; }

  @media print {
    body { background: #fff; }
    .no-print { display: none !important; }
    #selectView { display: none !important; }
    #printView { display: block !important; }
    #printPaper { gap: 0; margin: 0; }
    .page {
      box-shadow: none; margin: 0; width: auto; min-height: 0;
      height: auto !important; overflow: visible !important; padding: 0;
    }
    .page + .page { break-before: page; }
    @page { size: A4; margin: 12mm; }
  }
</style>
</head>
<body>

<div id="selectView">
  <h1>漢字読みシートクリエーター</h1>
  <p class="subtitle">学年を選んで、単元（タイトル）を選び、読みプリントまたは確認テストを作成してください。</p>
  <div class="grade-switch" id="gradeSwitch">
    <button type="button" class="grade-btn active" data-grade="1">中学１年</button>
    <button type="button" class="grade-btn" data-grade="2">光村２年</button>
  </div>
  <div class="toolbar">
    <button id="selectAllBtn" type="button">全選択</button>
    <button id="clearBtn" type="button">クリア</button>
    <span id="countLabel"></span>
    <button id="generateBtn" type="button" disabled>読みプリントを作成 →</button>
  </div>
  <div class="test-panel">
    <span class="desc">選択した単元の熟語から確認テスト（読みを書き込む形式）を作成します。問題1枚・解答1枚の構成です。</span>
    <span class="label">チェックテスト作成：</span>
    <button id="plainTestBtn" class="plainTestBtn" type="button" disabled>そのまま（単元順）</button>
    <button id="mixedTestBtn" class="mixedTestBtn" type="button" disabled>ミックステスト（ランダム）</button>
  </div>
  <div class="unit-grid" id="unitGrid"></div>
</div>

<div id="printView">
  <div class="print-toolbar no-print">
    <button id="backBtn" type="button">← 選択画面に戻る</button>
    <div class="spacer"></div>
    <button id="printBtn" type="button">印刷する</button>
  </div>
  <div id="printPaper">
    <div id="printContent"></div>
  </div>
</div>

let currentGrade = 1;

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// build selection UI
function buildUnitGrid() {
  unitGrid.innerHTML = '';
  DATA.sections.forEach(s => {
    const card = document.createElement('label');
    card.className = 'unit-card';
    card.innerHTML = `
      <input type="checkbox" data-num="${s.num}">
      <span>
        <span class="unit-title"><span class="unit-num">${s.circled}</span>${escapeHtml(s.title)}</span>
        <span class="unit-count">${s.kanji_list.length}字</span>
      </span>`;
    unitGrid.appendChild(card);
    const cb = card.querySelector('input');
    cb.addEventListener('change', () => {
      card.classList.toggle('checked', cb.checked);
      updateCount();
    });
  });
}
buildUnitGrid();

document.querySelectorAll('.grade-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const g = parseInt(btn.dataset.grade, 10);
    if (g === currentGrade) return;
    currentGrade = g;
    DATA = DATA_BY_GRADE[g].data;
    document.querySelectorAll('.grade-btn').forEach(b => b.classList.toggle('active', b === btn));
    buildUnitGrid();
    updateCount();
    document.getElementById('printView').classList.remove('active');
    document.getElementById('selectView').classList.remove('hidden');
    document.getElementById('printContent').innerHTML = '';
    window.scrollTo(0, 0);
  });
});

function getChecked() {
  return Array.from(unitGrid.querySelectorAll('input:checked')).map(cb => parseInt(cb.dataset.num, 10));
}

function updateCount() {
  const nums = getChecked();
  const secs = DATA.sections.filter(s => nums.includes(s.num));
  const kanjiCount = secs.reduce((a, s) => a + s.kanji_list.length, 0);
  countLabel.textContent = nums.length ? `選択中: ${nums.length}単元 / ${kanjiCount}字` : '';
  const disabled = nums.length === 0;
  generateBtn.disabled = disabled;
  plainTestBtn.disabled = disabled;
  mixedTestBtn.disabled = disabled;
}

document.getElementById('selectAllBtn').addEventListener('click', () => {
  unitGrid.querySelectorAll('input').forEach(cb => { cb.checked = true; cb.closest('.unit-card').classList.add('checked'); });
  updateCount();
});

document.getElementById('clearBtn').addEventListener('click', () => {
  unitGrid.querySelectorAll('input').forEach(cb => { cb.checked = false; cb.closest('.unit-card').classList.remove('checked'); });
  updateCount();
  // full reset: also return to selection view if a print/test result is showing
  document.getElementById('printView').classList.remove('active');
  document.getElementById('selectView').classList.remove('hidden');
  document.getElementById('printContent').innerHTML = '';
  window.scrollTo(0, 0);
});

document.getElementById('generateBtn').addEventListener('click', () => {
  const nums = getChecked();
  if (!nums.length) return;
  showPaper();
  renderPrint(nums);
});

plainTestBtn.addEventListener('click', () => {
  const nums = getChecked();
  if (!nums.length) return;
  showPaper();
  renderTest(nums, false);
});

mixedTestBtn.addEventListener('click', () => {
  const nums = getChecked();
  if (!nums.length) return;
  showPaper();
  renderTest(nums, true);
});

function showPaper() {
  document.getElementById('selectView').classList.add('hidden');
  document.getElementById('printView').classList.add('active');
  window.scrollTo(0, 0);
}

document.getElementById('backBtn').addEventListener('click', () => {
  document.getElementById('printView').classList.remove('active');
  document.getElementById('selectView').classList.remove('hidden');
  window.scrollTo(0, 0);
});

document.getElementById('printBtn').addEventListener('click', () => {

// ---- A4 shrink-to-fit helpers ----
let _mmPx = null;
function mmToPx(mm) {
  if (_mmPx === null) {
    const probe = document.createElement('div');
    probe.style.cssText = 'position:absolute; visibility:hidden; width:100mm; height:0;';
    document.body.appendChild(probe);
    _mmPx = probe.getBoundingClientRect().width / 100;
    document.body.removeChild(probe);
  }
  return mm * _mmPx;
}

// Shrinks bodyEl (a .columns-like block) so its natural (auto-height, balanced-column)
// rendered height fits within maxHeightPx. Escalates column count if even the
// smallest readable size does not fit. Mutates bodyEl's inline styles.
function shrinkToFit(bodyEl, maxHeightPxRaw, minCols, maxCols) {
  const FLOOR_K = 0.36;
  // leave a safety margin: browsers' on-screen measurement and the final paginated
  // print render can differ by a few px, so target slightly under the true budget.
  const maxHeightPx = maxHeightPxRaw * 0.965;

  let best = null; // remember the best (largest-cols) attempt even if it doesn't fully fit

  for (let cols = minCols; cols <= maxCols; cols++) {
    bodyEl.style.columnCount = String(cols);
    bodyEl.style.setProperty('--k', '1');
    let h = bodyEl.getBoundingClientRect().height;
    if (h <= maxHeightPx) return { cols, k: 1 };

    // check whether the floor size even fits at this column count before
    // trusting it as the binary-search lower bound
    bodyEl.style.setProperty('--k', FLOOR_K.toFixed(3));
    let hFloor = bodyEl.getBoundingClientRect().height;
    if (hFloor > maxHeightPx) {
      best = { cols, k: FLOOR_K, h: hFloor };
      continue; // even the smallest readable size overflows at this column count -> more columns
    }

    let lo = FLOOR_K, hi = 1;
    for (let i = 0; i < 20; i++) {
      const mid = (lo + hi) / 2;
      bodyEl.style.setProperty('--k', mid.toFixed(3));
      h = bodyEl.getBoundingClientRect().height;
      if (h <= maxHeightPx) lo = mid; else hi = mid;
    }
    bodyEl.style.setProperty('--k', lo.toFixed(3));
    h = bodyEl.getBoundingClientRect().height;
    best = { cols, k: lo, h };
    if (h <= maxHeightPx) return { cols, k: lo };
    // else: even at floor size it doesn't fit at this column count -> try more columns
  }
  // exhausted maxCols without a guaranteed fit: fall back to the last (most-columns) attempt
  if (best) {
    bodyEl.style.columnCount = String(best.cols);
    bodyEl.style.setProperty('--k', best.k.toFixed(3));
  }
  return best;
}

// Fits one .page's content (header + body) into a single A4 page area.
function fitPageBody(pageEl, headerEl, bodyEl, minCols, maxCols) {
  const usableHeightPx = mmToPx(273 - 6); // 297mm - 12mm*2 padding, minus a safety margin
  const headerHeightPx = headerEl.getBoundingClientRect().height;
  const gapPx = mmToPx(3);
  const availPx = Math.max(usableHeightPx - headerHeightPx - gapPx, mmToPx(40));
  shrinkToFit(bodyEl, availPx, minCols, maxCols);
}

// Chromium's print-to-PDF renderer has a reproducible bug where CSS
// column-count/column-balance content near a full page's height can render
// with clipped/overlapping text. To avoid it entirely, renderPrint never uses
// CSS multi-column layout: it measures items with plain single-column block
// flow (no column-balance involved at all, so the bug can't trigger), uses
// that to decide how many items fit per physical page, then splits that
// page's items between two independent flex columns (.print-flexcols),
// itself just ordinary block flow placed side-by-side.
function renderPrint(nums) {
  const secs = DATA.sections.filter(s => nums.includes(s.num));

  // Flatten into a linear list of flow items in reading order.
  const flow = [];
  secs.forEach(s => {
    flow.push({ kind: 'title', sec: s });
    s.kanji_list.forEach(k => flow.push({ kind: 'kanji', sec: s, k }));
  });

  function itemHtml(item, isFirstInColumn) {
    if (item.kind === 'title') {
      const extraMargin = isFirstInColumn ? '' : ' style="margin-top:4mm;"';
      return `<h2 class="section-title"${extraMargin}>${item.sec.circled} ${escapeHtml(item.sec.title)}</h2>`;
    }
    const k = item.k;
    let h = `<div class="kanji-block"><div class="kanji-head"><span class="kj">${escapeHtml(k.kanji)}</span><span class="kj-reading">${escapeHtml(k.head_reading)}</span></div>`;
    k.words.forEach(([w, r]) => {
      h += `<div class="wordrow"><span class="word">${escapeHtml(w)}</span><span class="reading">${escapeHtml(r)}</span></div>`;
    });
    h += `</div>`;
    return h;
  }

  const headerHtml = `<div class="doc-header">
    <h2>漢字 読みプリント（${DATA_BY_GRADE[currentGrade].label}）</h2>
    <div class="meta"><span>氏名：＿＿＿＿＿＿＿＿＿＿</span><span>${todayStr()}</span></div>
  </div>`;

  const printContent = document.getElementById('printContent');
  printContent.innerHTML = '';

  const NUM_COLS = 3;
  const PAGE_CONTENT_MM = 186; // 210mm - 12mm*2 page margins
  const COL_GAP_MM = 7;
  const COL_WIDTH_MM = (PAGE_CONTENT_MM - COL_GAP_MM * (NUM_COLS - 1)) / NUM_COLS;

  // Scratch element used purely for single-column height measurement
  // (never uses column-count, so the Chromium column-balance bug can't fire).
  // Its width matches one .print-flexcols grid column exactly (equal-width
  // grid tracks, so every column's real content width is the same value).
  const scratch = document.createElement('div');
  scratch.style.position = 'absolute';
  scratch.style.left = '-9999px';
  scratch.style.top = '0';
  scratch.style.visibility = 'hidden';
  scratch.style.width = COL_WIDTH_MM + 'mm';
  document.body.appendChild(scratch);

  function measureHtml(html) {
    scratch.innerHTML = html;
    return scratch.getBoundingClientRect().height;
  }

  const usableHeightPx = mmToPx(273 - 2); // 297mm - 12mm*2 page margins, minus a small safety margin
  const headerHeightPx = measureHtml(headerHtml); // includes the header's own margin-bottom (collapses into this measurement)
  const colNumHeightPx = measureHtml('<div class="col-num">1</div>'); // same for every column, every page

  let i = 0;
  let pageIndex = 0;
  let colNumber = 1; // numbers every column sequentially across the whole document
  const pages = []; // array of { headerHtml, colsHtml: [html, html, html] }

  while (i < flow.length) {
    const isFirstPage = pageIndex === 0;
    const colBudgetPx = (isFirstPage ? (usableHeightPx - headerHeightPx) : usableHeightPx) - colNumHeightPx;

    // Step 1: figure out how many items belong on this page at all, by
    // measuring them as a single (unsplit) column and capping at ~NUM_COLS x
    // one column's budget (since they'll shortly be divided across NUM_COLS
    // columns).
    let wholeHtml = '';
    let heights = []; // cumulative height after adding item k
    let j = i;
    while (j < flow.length) {
      const candidate = wholeHtml + itemHtml(flow[j], wholeHtml === '');
      const h = measureHtml(candidate);
      if (h <= colBudgetPx * NUM_COLS || wholeHtml === '') {
        wholeHtml = candidate;
        heights.push(h);
        j++;
      } else {
        break;
      }
    }
    const pageEnd = j; // items [i, pageEnd) belong on this page
    const total = heights.length ? heights[heights.length - 1] : 0;
    const isLastPage = pageEnd === flow.length; // no more items after this page

    // Step 2: decide how to split this page's items across columns.
    const colRanges = []; // [start, end) index pairs into flow
    let cur = i;
    if (isLastPage) {
      // The last page doesn't need to be stretched across all NUM_COLS columns:
      // fill column 1 to its budget first, then overflow into column 2, then 3,
      // leaving any columns that aren't needed empty rather than spreading
      // content thin to balance all three.
      for (let c = 0; c < NUM_COLS; c++) {
        if (cur >= pageEnd) { colRanges.push([cur, cur]); continue; }
        const prevHeight = cur > i ? heights[cur - i - 1] : 0;
        let splitAt = cur;
        for (let k = cur; k < pageEnd; k++) {
          const hSoFar = heights[k - i] - prevHeight;
          if (hSoFar <= colBudgetPx) {
            splitAt = k + 1;
          } else {
            break;
          }
        }
        if (splitAt <= cur) splitAt = Math.min(cur + 1, pageEnd); // always keep at least 1 item
        colRanges.push([cur, splitAt]);
        cur = splitAt;
      }
    } else {
      // Not the last page: walk left to right, handing each column a target
      // share of the remaining height (remaining total / remaining columns),
      // capped at a single column's own budget, so every column on a full
      // page ends up filled about evenly.
      for (let c = 0; c < NUM_COLS; c++) {
        if (c === NUM_COLS - 1) {
          colRanges.push([cur, pageEnd]);
          break;
        }
        const prevHeight = cur > i ? heights[cur - i - 1] : 0;
        const remainingTotal = total - prevHeight;
        const remainingCols = NUM_COLS - c;
        const target = Math.min(remainingTotal / remainingCols, colBudgetPx);
        let splitAt = cur;
        for (let k = cur; k < pageEnd; k++) {
          const hSoFar = heights[k - i] - prevHeight;
          if (hSoFar <= target) {
            splitAt = k + 1;
          } else {
            break;
          }
        }
        if (splitAt <= cur) splitAt = Math.min(cur + 1, pageEnd); // always keep at least 1 item
        colRanges.push([cur, splitAt]);
        cur = splitAt;
      }
    }

    function htmlForRange(range) {
      let h = '';
      for (let k = range[0]; k < range[1]; k++) h += itemHtml(flow[k], k === range[0]);
      return h;
    }

    // Safety: walk the columns in order; if one ended up taller than its own
    // budget (possible when a single item dominates), shrink it back by
    // moving its trailing items — and every column after it on this page —
    // to the next page, rather than letting content overflow the sheet.
    let pageEndActual = i;
    const finalRanges = [];
    for (let c = 0; c < NUM_COLS; c++) {
      let [start, end] = colRanges[c];
      if (start >= end && start > pageEndActual) { finalRanges.push([start, start]); continue; }
      let html = htmlForRange([start, end]);
      while (end > start && measureHtml(html) > colBudgetPx) {
        end--;
        html = htmlForRange([start, end]);
      }
      finalRanges.push([start, end]);
      pageEndActual = Math.max(pageEndActual, end);
      if (end < colRanges[c][1]) break; // this column got shrunk — stop placing items in later columns this page
    }
    while (finalRanges.length < NUM_COLS) finalRanges.push([pageEndActual, pageEndActual]);

    const colsHtml = finalRanges
      .filter(r => r[1] > r[0]) // drop empty columns entirely (no box, no column) rather than render blank ones
      .map(r => {
        const numBox = `<div class="col-num">${colNumber++}</div>`;
        return numBox + htmlForRange(r);
      });

    pages.push({ headerHtml: isFirstPage ? headerHtml : '', colsHtml });
    if (pageEndActual === i) break; // safety valve against an infinite loop
    i = pageEndActual;
    pageIndex++;
  }

  document.body.removeChild(scratch);

  const pagesHtml = pages.map(p => `<div class="page">${p.headerHtml}<div class="print-flexcols">${p.colsHtml.map(h => `<div class="col">${h}</div>`).join('')}</div></div>`).join('');
  printContent.innerHTML = pagesHtml;
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function renderTest(nums, mixed) {
  const secs = DATA.sections.filter(s => nums.includes(s.num));

  let counter = 0;
  const answers = []; // {num, word, reading}
  let questionsHtml = '';

  if (!mixed) {
    // そのまま：単元順・単元内の元の順番を保持し、タイトルごとに区切って表示
    secs.forEach(s => {
      questionsHtml += `<div class="test-section-title">${s.circled} ${escapeHtml(s.title)}</div>`;
      s.kanji_list.forEach(k => {
        k.words.forEach(([w, r]) => {
          counter++;
          questionsHtml += `<div class="test-row"><span class="num">${counter}.</span><span class="word">${escapeHtml(w)}</span><span class="blank"></span></div>`;
          answers.push({num: counter, word: w, reading: r});
        });
      });
    });
  } else {
    // ミックス：選択単元の熟語を全部フラットにしてランダムに混ぜる
    let flat = [];
    secs.forEach(s => {
      s.kanji_list.forEach(k => {
        k.words.forEach(([w, r]) => flat.push({word: w, reading: r}));
      });
    });
    flat = shuffle(flat);
    flat.forEach(item => {
      counter++;
      questionsHtml += `<div class="test-row"><span class="num">${counter}.</span><span class="word">${escapeHtml(item.word)}</span><span class="blank"></span></div>`;
      answers.push({num: counter, word: item.word, reading: item.reading});
    });
  }

  let answersHtml = '';
  answers.forEach(a => {
    answersHtml += `<div class="answer-row"><span class="num">${a.num}.</span><span class="word">${escapeHtml(a.word)}</span><span class="reading">${escapeHtml(a.reading)}</span></div>`;
  });

  const qHeader = `<div class="doc-header">
    <h2>漢字 確認テスト${mixed ? '（ミックス）' : ''}（${DATA_BY_GRADE[currentGrade].label}）</h2>
    <div class="meta test-meta"><span>氏名：＿＿＿＿＿＿＿＿＿＿</span><span>点数：＿＿＿／＿＿＿</span><span>${todayStr()}</span></div>
  </div>`;
  const aHeader = `<div class="doc-header">
    <h2>漢字 確認テスト${mixed ? '（ミックス）' : ''}　解答（${DATA_BY_GRADE[currentGrade].label}）</h2>
    <div class="meta"><span>${todayStr()}</span></div>
  </div>`;

  const container = document.getElementById('printContent');
  container.innerHTML = `
    <div class="page-label no-print">問題</div>
    <div class="page fixed" id="testQPage">
      ${qHeader}
      <div class="columns test-columns" id="testQBody">${questionsHtml}</div>
    </div>
    <div class="page-label no-print">解答</div>
    <div class="page fixed" id="testAPage">
      ${aHeader}
      <div class="columns answer-columns" id="testABody">${answersHtml}</div>
    </div>
  `;

  const qPage = document.getElementById('testQPage');
  const qHeaderEl = qPage.querySelector('.doc-header');
  const qBody = document.getElementById('testQBody');
  fitPageBody(qPage, qHeaderEl, qBody, 2, 8);

  const aPage = document.getElementById('testAPage');
  const aHeaderEl = aPage.querySelector('.doc-header');
  const aBody = document.getElementById('testABody');
  fitPageBody(aPage, aHeaderEl, aBody, 2, 8);
}
